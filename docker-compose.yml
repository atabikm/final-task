services:
  nginx:
    image: nginx:alpine
    container_name: reverb_nginx
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - reverb-net

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.fpm
    container_name: reverb_app
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=reverb_db
      - DB_USERNAME=reverb_user
      - DB_PASSWORD=secretpassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
      - reverb
    networks:
      - reverb-net

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.fpm
    container_name: reverb_server
    command: php artisan reverb:start --host=0.0.0.0 --port=6001 --no-interaction
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=reverb_db
      - DB_USERNAME=reverb_user
      - DB_PASSWORD=secretpassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "6001:6001"
    depends_on:
      - db
      - redis
    networks:
      - reverb-net

  redis:
    image: redis:alpine
    container_name: reverb_redis
    ports:
      - "6379:6379"
    networks:
      - reverb-net

  db:
    image: mariadb:10.11
    container_name: reverb_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reverb_db
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_USER: reverb_user
      MYSQL_PASSWORD: secretpassword
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - reverb-net

volumes:
  dbdata:

networks:
  reverb-net:
    driver: bridge